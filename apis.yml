description: Mosaic (Mosaic Building Group) is a full-stack construction technology company founded in
  2017 and headquartered in Phoenix, Arizona. It is a national leader in build-to-rent residential
  construction and pre-development, pairing in-house software with local homebuilding partners to
  deliver personalized homes faster and at lower cost across Arizona and Texas. Its Mosaic Hub platform
  applies AI to construction planning and operations management. Backed by a16z (Series A lead) alongside
  Greylock, Innovation Endeavors, Founders Fund, Thrive Capital, SV Angel, and 8VC. Mosaic operates as a
  hybrid construction-plus-software business and does not publish a public developer API, developer
  portal, or API documentation at this time.
